name: Security and regression checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node node_modules/typescript/bin/tsc -p server/tsconfig.build.json --noEmit
      - run: node node_modules/jest/bin/jest.js --config server/package.json --runInBand
      - run: node ../node_modules/vitest/vitest.mjs run
        working-directory: client
      - run: npm run vite-build -w client
