name: watsolution-integration
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: ws_integration
      POSTGRES_USER: ws_test
      # Synthetic credential for the loopback-only disposable database.
      POSTGRES_PASSWORD: ws_test_only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ws_test -d ws_integration']
      interval: 2s
      timeout: 3s
      retries: 20
