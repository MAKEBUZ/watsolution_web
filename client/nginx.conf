server {
    listen      ${PORT};
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.bold.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://tiles.basemaps.cartocdn.com; worker-src 'self' blob:; frame-src 'self' https://checkout.bold.co; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.bold.co; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    # Emit one authoritative policy even when the API also protects its direct origin.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;

    # Do not expose accidentally copied environment files, keys or repository metadata.
    location ~ /\. { return 404; }

    # Serve the legal document with or without a trailing slash.
    location = /condiciones-del-servicio {
        rewrite ^ /condiciones-del-servicio/ last;
    }
    location = /whatsapp {
        rewrite ^ /whatsapp/ last;
    }

    # SPA routing — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the NestJS backend
    location /api/ {
        proxy_pass          ${BACKEND_URL}/api/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /management/ {
        proxy_pass          ${BACKEND_URL}/management/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /v3/ {
        proxy_pass          ${BACKEND_URL}/v3/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
    }
}
