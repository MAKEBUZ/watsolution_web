server {
    listen      ${PORT};
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # Do not expose accidentally copied environment files, keys or repository metadata.
    location ~ /\. { return 404; }

    # SPA routing — all unknown paths fall back to index.html
    location / {
        add_header Cache-Control "no-store" always;
        # add_header in a location replaces the server-level set in older Nginx versions.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the NestJS backend
    location /api/ {
        proxy_pass          ${BACKEND_URL}/api/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /management/ {
        proxy_pass          ${BACKEND_URL}/management/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /v3/ {
        proxy_pass          ${BACKEND_URL}/v3/;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header    Host              $proxy_host;
    }
}
